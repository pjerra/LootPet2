name: lua

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1, Lua 5.4 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua5.4 lua-check

      # ALE runs whichever Lua the server was built with; a script has to
      # parse under the oldest and the newest.
      - name: Compile under Lua 5.1
        run: |
          set -e
          for f in $(git ls-files '*.lua'); do luac5.1 -p "$f"; echo "ok 5.1 $f"; done

      - name: Compile under Lua 5.4
        run: |
          set -e
          for f in $(git ls-files '*.lua'); do luac5.4 -p "$f"; echo "ok 5.4 $f"; done

      # Undefined globals are the one class of bug the compiler cannot see:
      # a local used above its declaration, or a misspelt ALE function, only
      # fails when that line runs on the server.
      - name: luacheck
        run: luacheck $(git ls-files '*.lua')

      # Drives the real HarvestCorpse and the pet preference store against a
      # stubbed ALE, so reverting a coin-split / double-skin / chosen-pet fix fails here.
      - name: Behaviour tests (Lua 5.1 and 5.4)
        run: |
          set -e
          lua5.1 tests/harvest_test.lua
          lua5.4 tests/harvest_test.lua
